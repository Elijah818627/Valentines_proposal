<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap">
    <link rel="stylesheet" href="style.css"> <!-- Link to external stylesheet -->
</head>
<body>
    <div id="container">
        <div id="image-container"></div> <!-- Container for displaying images -->
        <div id="text-container">
            <div id="question">Will you be my valentine, Lana my loves?</div> <!-- Question -->
            <div id="options">
                <button id="yes-button" onclick="selectOption('yes')">Yes</button> <!-- Yes button -->
                <button id="no-button" onclick="selectOption('no')">No</button> <!-- No button -->
    <div style="position: relative;">
  <img src="loml.gif" alt="background" style="display: block; width: 100%;">
  <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 20px; text-align: center;">
    See you soon, my love!!!
  </div>
</div>

</div>
    <script>
        document.addEventListener('mousemove', (e) => {
            let body = document.querySelector('body');
            let heart = document.createElement('span');
            let x = e.offsetX;
            let y = e.offsetY;
            heart.style.left = x+ 'px';
            heart.style.top = y+ 'px';

            let size = Math.random() * 50;
            heart.style.width = 5 + size+ 'px';
            heart.style.height = 5 + size+ 'px';
        

            let transformValue = Math.random() * 360;
            heart.style.transform = 'rotate('+ transformValue + 'deg)';

            body.appendChild(heart);

            setTimeout( () => {
                heart.remove();
            }, 1000)
        })
    </script>
    <script src="script.js"></script> <!-- Link to external JavaScript file -->
    <audio controls autoplay style="display: none;">
        <source src="Rather be.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
        </audio>
</body>
</html>
